<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="card"><rect width="800" height="220" rx="6"/></clipPath>
    <style>
      .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'Segoe UI Mono', 'Cascadia Code', 'Courier New', monospace; }
      @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes drift   { from { transform: translateX(0); } to { transform: translateX(-40px); } }
      @keyframes blink   { 50% { opacity: 0; } }
      @keyframes pulse   { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }
      @keyframes rise    { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes roll    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .stars { animation: drift 40s linear infinite alternate; }
      .t1 { animation: twinkle 3.1s ease-in-out infinite; }
      .t2 { animation: twinkle 4.3s ease-in-out 1s infinite; }
      .t3 { animation: twinkle 5.7s ease-in-out 2s infinite; }
      .rec  { animation: blink 1.2s steps(2) infinite; }
      .ring { transform-origin: 400px 150px; animation: pulse 2.4s ease-out infinite; }
      .ttl  { opacity: 0; animation: rise 1.6s ease-out .3s forwards; }
      .sub  { opacity: 0; animation: rise 1.6s ease-out 1s forwards; }
      .bar  { transform-origin: 0 0; animation: roll 12s linear infinite; }
    </style>
  </defs>

